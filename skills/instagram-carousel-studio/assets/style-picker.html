<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Carousel — Four Starter Styles</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Noto Sans TC", "PingFang HK", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px; background: #e9ebf0; color: #15161a; }
    header { max-width: 1500px; margin: 0 auto 28px; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; color: #5c616b; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(320px, 540px)); gap: 32px; max-width: 1140px; margin: auto; }
    .option { margin: 0; }
    figcaption { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 800; }
    figcaption small { color: #6a6f79; font-weight: 600; }
    .cover { position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 20px; box-shadow: 0 18px 46px rgba(15,18,28,.18); }
    .logo-zone { position: absolute; top: 7%; left: 7%; padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .copy { position: absolute; z-index: 4; }
    .eyebrow { font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .headline { margin: 10px 0 12px; font-weight: 950; line-height: .98; letter-spacing: -.045em; }
    .sub { font-weight: 650; line-height: 1.45; }
    .cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 900; }

    .editorial { background: #f4f0e7; color: #171717; }
    .editorial::after { content:""; position:absolute; width:52%; height:68%; right:-8%; bottom:-7%; background:linear-gradient(145deg,#ff5c35,#ffca3a); transform:rotate(-9deg); border-radius:44% 48% 16% 60%; }
    .editorial .logo-zone { background:#171717; color:#fff; }
    .editorial .copy { left:7%; top:19%; width:78%; }
    .editorial .eyebrow { font-size:13px; color:#d13c20; }
    .editorial .headline { font-size:54px; }
    .editorial .sub { max-width:68%; font-size:17px; }
    .editorial .cta { background:#171717; color:#fff; }

    .dark { background: radial-gradient(circle at 78% 18%, #6753ff 0 8%, transparent 35%), linear-gradient(145deg,#080b13,#11162a 55%,#080b13); color:#f7f8ff; }
    .dark::before { content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(130,152,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(130,152,255,.12) 1px,transparent 1px); background-size:34px 34px; mask-image:linear-gradient(to bottom,black,transparent 80%); }
    .dark .orb { position:absolute; right:7%; bottom:14%; width:42%; aspect-ratio:1; border-radius:32%; background:linear-gradient(145deg,#39d0ff,#644eff 50%,#d73bff); box-shadow:0 0 70px #6256ff88; transform:rotate(12deg); }
    .dark .orb::after { content:"4"; display:grid; place-items:center; height:100%; font-size:96px; font-weight:950; color:#080b13; }
    .dark .logo-zone { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.26); }
    .dark .copy { left:7%; top:22%; width:78%; }
    .dark .eyebrow { font-size:13px; color:#72dbff; }
    .dark .headline { font-size:51px; }
    .dark .sub { width:62%; font-size:17px; color:#c9cfee; }
    .dark .cta { background:#75e2ff; color:#080b13; }

    .product { background:linear-gradient(135deg,#faf8ff,#e8e2ff 45%,#f7fbff); color:#15121e; }
    .product::before { content:""; position:absolute; inset:-10%; background:radial-gradient(circle at 90% 5%,#fff 0 14%,transparent 34%),radial-gradient(circle at 20% 100%,#b699ff88,transparent 34%); }
    .product .case { position:absolute; right:3%; bottom:5%; width:52%; height:64%; border-radius:52px; border:2px solid rgba(255,255,255,.8); background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(143,116,242,.22)); box-shadow:inset 0 0 28px #fff,0 28px 50px rgba(81,54,175,.25); transform:rotate(2deg); }
    .product .tangle { position:absolute; inset:17% 10%; border-radius:50%; background:repeating-radial-gradient(ellipse at 45% 55%,transparent 0 8px,#6940d8 9px 13px,transparent 14px 20px); filter:drop-shadow(0 5px 5px #6d4bd455); transform:rotate(-13deg); }
    .product .logo-zone { background:#fff; color:#27174d; box-shadow:0 5px 18px #7861be33; }
    .product .copy { left:7%; top:19%; width:81%; }
    .product .eyebrow { font-size:13px; color:#6340c8; }
    .product .headline { width:72%; font-size:50px; }
    .product .sub { width:49%; font-size:16px; }
    .product .cta { background:#6f42d9; color:#fff; }

    .tactile { background:linear-gradient(155deg,#d8ffd1,#7de1c3 58%,#3ba6aa); color:#10251f; }
    .tactile .blocks { position:absolute; right:4%; bottom:6%; width:49%; height:70%; }
    .tactile .block { position:absolute; display:grid; place-items:center; width:58%; aspect-ratio:1.25; border-radius:22px; background:linear-gradient(145deg,#f4ffe9,#8fd897); border:2px solid rgba(255,255,255,.7); box-shadow:0 16px 24px rgba(7,76,53,.2), inset 0 3px 10px rgba(255,255,255,.8); font-size:30px; font-weight:950; }
    .tactile .block:nth-child(1){right:2%;top:3%;transform:rotate(8deg)}
    .tactile .block:nth-child(2){left:0;top:31%;transform:rotate(-7deg);background:linear-gradient(145deg,#fff5b9,#f3b641)}
    .tactile .block:nth-child(3){right:1%;bottom:4%;transform:rotate(3deg);background:linear-gradient(145deg,#d9efff,#6bb4ed)}
    .tactile .logo-zone { background:#103f34; color:#fff; }
    .tactile .copy { left:7%; top:20%; width:82%; }
    .tactile .eyebrow { font-size:13px; color:#126c57; }
    .tactile .headline { width:74%; font-size:49px; }
    .tactile .sub { width:48%; font-size:16px; }
    .tactile .cta { background:#103f34; color:#fff; }
    @media (max-width: 820px) { body{padding:20px}.grid{grid-template-columns:1fr}.headline{font-size:clamp(34px,9vw,54px)!important} }
  </style>
</head>
<body>
  <header>
    <h1>四款 Starter Styles</h1>
    <p>以下四張使用完全相同內容，只比較設計機制。選 Style 後先製作完整 10 張。</p>
  </header>
  <main class="grid">
    <figure class="option"><figcaption>A — Editorial Contrast <small>觀點／策略</small></figcaption><article class="cover editorial"><div class="logo-zone">YOUR LOGO</div><div class="copy"><div class="eyebrow">AI KNOWLEDGE SYSTEM</div><h2 class="headline">點解你個<br>知識庫愈整<br>愈複雜？</h2><p class="sub">四層框架，將工具堆疊變成可持續維護嘅成果。</p><span class="cta">留言 GUIDE 攞筆記</span></div></article></figure>
    <figure class="option"><figcaption>B — Dark System <small>AI／系統</small></figcaption><article class="cover dark"><div class="logo-zone">YOUR LOGO</div><div class="orb"></div><div class="copy"><div class="eyebrow">AI KNOWLEDGE SYSTEM</div><h2 class="headline">點解你個<br>知識庫愈整<br>愈複雜？</h2><p class="sub">四層框架，將工具堆疊變成可持續維護嘅成果。</p><span class="cta">留言 GUIDE 攞筆記</span></div></article></figure>
    <figure class="option"><figcaption>C — Product Visual <small>工具／轉變</small></figcaption><article class="cover product"><div class="logo-zone">YOUR LOGO</div><div class="case"><div class="tangle"></div></div><div class="copy"><div class="eyebrow">AI KNOWLEDGE SYSTEM</div><h2 class="headline">點解你個<br>知識庫愈整<br>愈複雜？</h2><p class="sub">四層框架，將工具堆疊變成可持續維護嘅成果。</p><span class="cta">留言 GUIDE 攞筆記</span></div></article></figure>
    <figure class="option"><figcaption>D — Tactile Explainer <small>步驟／框架</small></figcaption><article class="cover tactile"><div class="logo-zone">YOUR LOGO</div><div class="blocks"><div class="block">目的</div><div class="block">結構</div><div class="block">連結</div></div><div class="copy"><div class="eyebrow">AI KNOWLEDGE SYSTEM</div><h2 class="headline">點解你個<br>知識庫愈整<br>愈複雜？</h2><p class="sub">四層框架，將工具堆疊變成可持續維護嘅成果。</p><span class="cta">留言 GUIDE 攞筆記</span></div></article></figure>
  </main>
</body>
</html>
